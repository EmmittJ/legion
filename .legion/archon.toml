[daemon]
pulse_interval_seconds   = 10
watcher_interval_seconds = 30
vessel_timeout_seconds   = 1800

[limits]
max_global = 5

# [roles] maps each functional role to its agent pool and concurrency cap.
# Archon selects an agent from the pool using the configured strategy.
# This section is optional — if absent, Archon falls back to built-in defaults.

[roles.worker]
agents   = ["wraith"]
limit    = 3
strategy = "first"

[roles.planner]
agents   = ["hierophant"]
limit    = 1
strategy = "first"

[roles.reviewer]
agents   = ["inquisitor"]
limit    = 1
strategy = "first"

[routing]
router_agent   = "hermes"
default_role   = "worker"
max_dispatch   = 3
dispatch_label = "dispatch:auto"

[review]
enabled               = true
max_rework            = 3
delete_branch_on_merge = true

[vessel]
default_model = ""

[vessel.model_tiers]
fast     = "claude-haiku-4.5"
standard = "claude-sonnet-4.6"
premium  = "claude-opus-4.6"

[vessel.role_model_defaults]
worker   = "standard"
planner  = "standard"
reviewer = "premium"

[hermes]
enabled         = false
image           = ""
timeout_seconds = 30
