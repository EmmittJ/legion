name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Integration tests (Docker)
        run: go test -tags integration ./internal/vessel

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build vessel-base
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: images/vessel-base/Dockerfile
          tags: legion/vessel-base:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build vessel-copilot
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: images/vessel-copilot/Dockerfile
          tags: legion/vessel-copilot:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build archon
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: images/archon/Dockerfile
          tags: legion/archon:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
