# Legion local dev stack
# Required env vars: REPO_URL, GITHUB_TOKEN
# Optional env vars: VESSEL_IMAGE (default: legion/vessel-copilot:latest), ARCHON_TIMEOUT (default: 3600), VESSEL_MODEL (default: gpt-5-mini)
# Observability:
#   Grafana:           http://localhost:3000  (traces, logs, metrics — unified UI)
#   Prometheus:        http://localhost:9090  (metrics query UI)
#   Tempo (traces):    via Grafana
#   Loki (logs):       via Grafana
# Usage:
#   docker compose build
#   REPO_URL=https://github.com/owner/repo GITHUB_TOKEN=ghp_xxx docker compose up

services:
  dolt:
    image: dolthub/dolt-sql-server:latest
    ports:
      - "3306:3306"
    environment:
      - DOLT_SQL_SERVER_PORT=3306
    volumes:
      - dolt-data:/var/lib/dolt
      - ./dolt-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "dolt", "sql", "--query", "SELECT 1;"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - legion-net

  archon:
    build:
      context: .
      dockerfile: cmd/archon/Dockerfile
    environment:
      - REPO_URL=${REPO_URL}
      - VESSEL_IMAGE=${VESSEL_IMAGE:-legion/vessel-copilot:latest}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - ARCHON_TIMEOUT=${ARCHON_TIMEOUT:-3600}
      - VESSEL_MODEL=${VESSEL_MODEL:-gpt-5-mini}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=legion.archon
      - DOLT_DSN=mysql://root@dolt:3306/beads
      - BEADS_DOLT_SERVER_HOST=dolt
      - BEADS_DOLT_SERVER_PORT=3306
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      dolt:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - legion-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4318:4318"   # OTLP HTTP (from binaries on host)
      - "4317:4317"   # OTLP gRPC
      - "13133:13133" # Health check endpoint
    depends_on:
      - tempo
      - loki
    networks:
      - legion-net

  tempo:
    image: grafana/tempo:2.10.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo UI / query API
    networks:
      - legion-net

  loki:
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - legion-net

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"     # Prometheus UI
    networks:
      - legion-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3300:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - tempo
      - loki
      - prometheus
    networks:
      - legion-net

networks:
  legion-net:
    driver: bridge

volumes:
  dolt-data:
  tempo-data:
  loki-data:
  grafana-data:
