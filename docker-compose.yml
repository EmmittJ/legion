# Legion deployment: the archon reconciler, plus an optional local
# observability dashboard (profile: obs).
#
#   docker compose up -d archon
#   docker compose --profile obs up -d
#
# Vessels are summoned by the archon as sibling containers on the host
# daemon (not inside this compose project). For vessel telemetry, point
# OTEL_EXPORTER_OTLP_ENDPOINT at an address reachable from any container,
# e.g. http://host.docker.internal:4318 with the obs profile running.

name: legion

services:
  archon:
    build:
      context: .
      dockerfile: images/archon/Dockerfile
    restart: unless-stopped
    environment:
      GH_TOKEN: ${GH_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.legion:/legion/.legion:ro

  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5.2
    profiles: [obs]
    environment:
      # Dev-loop convenience: no browser-token login prompt. Do not set this
      # in any deployment reachable outside a trusted local/dev network.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888" # dashboard UI
      - "4317:18889"  # OTLP gRPC
      - "4318:18890"  # OTLP HTTP
