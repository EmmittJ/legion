# Legion deployment: the archon reconciler, plus an optional local
# observability stack (profile: obs).
#
#   docker compose up -d archon
#   docker compose --profile obs up -d
#
# Vessels are summoned by the archon as sibling containers on the host
# daemon (not inside this compose project). For vessel telemetry, point
# OTEL_EXPORTER_OTLP_ENDPOINT at an address reachable from any container,
# e.g. http://host.docker.internal:4318 with the obs profile running.

name: legion

services:
  archon:
    build:
      context: .
      dockerfile: images/archon/Dockerfile
    restart: unless-stopped
    environment:
      GH_TOKEN: ${GH_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.legion:/legion/.legion:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    profiles: [obs]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./deploy/obs/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  tempo:
    image: grafana/tempo:2.7.1
    profiles: [obs]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./deploy/obs/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [obs]
    volumes:
      - ./deploy/obs/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.5.2
    profiles: [obs]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./deploy/obs/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "3000:3000"

volumes:
  tempo-data:
