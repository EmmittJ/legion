apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false

  # Loki must come before Tempo so that Tempo's datasourceUid: loki reference
  # resolves at provisioning time. Grafana 11 validates UID cross-references
  # sequentially — if the referenced datasource hasn't been provisioned yet
  # when the current entry is processed, provisioning fails with
  # "data source not found".
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    # Note: derivedFields with datasourceUid: tempo would create a circular
    # dependency (Loki→Tempo, Tempo→Loki) and cannot be resolved without a
    # two-pass provisioner.  The Loki→Tempo back-link is left for manual
    # configuration in the Grafana UI if needed.

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        filterByTraceID: true
        filterBySpanID: false
      lokiSearch:
        datasourceUid: loki
