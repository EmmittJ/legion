server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      # Strip the leading slash Docker adds to container names: /legion-archon-1 → legion-archon-1
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container_name'

      # Only collect from legion-* containers — avoids vendor noise and Promtail self-loops
      - source_labels: ['container_name']
        regex: 'legion-.*'
        action: keep

      # Compose service name (e.g. "archon", "dolt"). Empty for standalone vessel containers.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

      # Extract issue_id from vessel container name: legion-vessel-<issue_id>
      # e.g. "legion-vessel-123-my-bug" → issue_id="123-my-bug"
      - source_labels: ['container_name']
        regex: 'legion-vessel-(.+)'
        target_label: 'issue_id'

      # Preserve stdout vs stderr distinction for log-level triage
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'log_stream'

    pipeline_stages:
      # Attempt JSON parse for structured logs (archon, vessel-driver emit JSON via slog)
      # Stages that fail on non-JSON logs pass the raw line through — no data lost.
      - json:
          expressions:
            level: level
            msg: msg

      # Promote extracted "level" to an index label so log-level queries are fast
      - labels:
          level:
